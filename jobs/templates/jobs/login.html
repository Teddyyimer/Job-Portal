
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Job Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 40px 20px;
        }

        .form-container {
            max-width: 450px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px #00000012;
        }

        h1 { color: #173b70; }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin: 6px 0 12px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1769e0;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .errorlist, .error {
            color: #c62828;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Welcome back</h1>
        <p>Log in to your Job Portal account.</p>

        {% if form.errors %}
            <p class="error">
                Your username or password is incorrect.
                Please try again.
            </p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Log In</button>
        </form>

        <p>Don't have an account?
            <a href="{% url 'register' %}">Create one</a>
        </p>

        <p><a href="{% url 'home' %}">Back to home</a></p>
    </div>
</body>
</html>
